<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f2ed">

  <title>Una sorpresa per te ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f8f2ed;
      color: #493c3c;
      font-family: Georgia, 'Times New Roman', serif;
      overflow-x: hidden;
    }

    /* PAGINA INIZIALE */

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 24px;
      position: relative;
      overflow: hidden;
    }

    .decoration {
      position: absolute;
      color: #d9a9a8;
      opacity: 0.45;
      pointer-events: none;
    }

    .heart-one {
      top: 13%;
      left: 12%;
      font-size: 30px;
      transform: rotate(-15deg);
    }

    .heart-two {
      bottom: 17%;
      right: 12%;
      font-size: 42px;
      transform: rotate(15deg);
    }

    .heart-three {
      top: 25%;
      right: 19%;
      font-size: 20px;
    }

    .content {
      width: 100%;
      max-width: 540px;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: appear 1.4s ease;
    }

    .small-title {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #a98483;
      margin-bottom: 35px;
    }

    .flower {
      font-size: 36px;
      margin-bottom: 22px;
      color: #c48f91;
    }

    h1 {
      font-size: clamp(38px, 8vw, 58px);
      font-weight: normal;
      line-height: 1.2;
      margin-bottom: 22px;
      color: #594444;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.8;
      color: #8d7773;
      font-style: italic;
      margin: 0 auto 38px;
      max-width: 390px;
    }

    .divider {
      width: 45px;
      height: 1px;
      background: #c99b99;
      margin: 0 auto 35px;
    }

    .start-button {
      display: inline-block;
      border: 1px solid #c99b99;
      background: #c99b99;
      color: white;
      padding: 18px 34px;
      min-height: 56px;
      border-radius: 50px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.35s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .start-button:hover {
      background: transparent;
      color: #a87979;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(160, 115, 115, 0.12);
    }

    .start-button:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 55px;
      font-size: 14px;
      font-style: italic;
      color: #ad9993;
    }

    /* SCHERMATA VIDEO */

    .video-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #171414;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .video-screen.active {
      display: flex;
      animation: appear 0.7s ease;
    }

    .video-container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .video-container video {
      width: 100%;
      max-height: 80vh;
      max-height: 80svh;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 5px;
    }

    .close-button {
      position: absolute;
      top: 25px;
      right: 30px;
      border: none;
      background: transparent;
      color: white;
      font-size: 32px;
      cursor: pointer;
      opacity: 0.8;
    }

    .video-caption {
      color: #e7d8d4;
      font-size: 14px;
      font-style: italic;
      margin-top: 18px;
    }

    /* ANIMAZIONI */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* OTTIMIZZAZIONE SMARTPHONE */

    @media (max-width: 600px) {

      .page {
        padding: 35px 24px;
      }

      .content {
        max-width: 100%;
      }

      .small-title {
        font-size: 9px;
        letter-spacing: 3px;
        margin-bottom: 28px;
      }

      .flower {
        font-size: 32px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: clamp(34px, 9vw, 46px);
        line-height: 1.2;
        margin-bottom: 22px;
      }

      .subtitle {
        font-size: 16px;
        line-height: 1.9;
        max-width: 360px;
        margin-bottom: 35px;
      }

      .divider {
        margin-bottom: 32px;
      }

      .start-button {
        width: 100%;
        max-width: 310px;
        min-height: 56px;
        padding: 17px 20px;
        font-size: 10px;
        letter-spacing: 1.5px;
      }

      .footer {
        margin-top: 45px;
        font-size: 14px;
      }

      .heart-one {
        top: 8%;
        left: 7%;
      }

      .heart-two {
        bottom: 8%;
        right: 7%;
      }

      .heart-three {
        top: 18%;
        right: 9%;
      }

      .video-screen {
        padding: 15px;
      }

      .video-container video {
        max-height: 75svh;
        width: 100%;
        object-fit: contain;
      }

      .close-button {
        top: 12px;
        right: 18px;
        font-size: 32px;
      }

      .video-caption {
        font-size: 13px;
        line-height: 1.6;
      }
    }

  </style>
</head>

<body>

  <!-- PAGINA DI BENVENUTO -->

  <main class="page">

    <span class="decoration heart-one">♡</span>
    <span class="decoration heart-two">♡</span>
    <span class="decoration heart-three">✧</span>

    <section class="content">

      <div class="small-title">
        Un piccolo pensiero per te
      </div>

      <div class="flower">♡</div>

      <h1>Buon compleanno Principessa</h1>

      <p class="subtitle">
        Il giorno più importante dell'anno è arrivato
        e tu sei invecchiata un altro anno...
        spero di festeggiare altre 100 volte insieme
        a te questo giorno speciale ❤️
      </p>

      <div class="divider"></div>

      <button class="start-button" onclick="startVideo()">
        Apri la tua sorpresa ♡
      </button>

      <div class="footer">
        Love You ❤️
      </div>

    </section>

  </main>

  <!-- SCHERMATA DEL VIDEO -->

  <section class="video-screen" id="videoScreen">

    <button
      class="close-button"
      onclick="closeVideo()"
      aria-label="Chiudi video">
      ×
    </button>

    <div class="video-container">

      <video id="myVideo" controls playsinline>
        <source src="video.mp4" type="video/mp4">
        Il tuo browser non supporta la riproduzione video.
      </video>

      <p class="video-caption">
        Ogni momento con te è un ricordo da custodire.
      </p>

    </div>

  </section>

  <!-- FUNZIONI -->

  <script>

    function startVideo() {
      const screen = document.getElementById("videoScreen");
      const video = document.getElementById("myVideo");

      screen.classList.add("active");

      video.play().catch(() => {
        // Se la riproduzione automatica non è consentita,
        // sarà possibile premere Play manualmente.
      });
    }

    function closeVideo() {
      const screen = document.getElementById("videoScreen");
      const video = document.getElementById("myVideo");

      video.pause();
      video.currentTime = 0;
      screen.classList.remove("active");
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeVideo();
      }
    });

  </script>

</body>
</html>
